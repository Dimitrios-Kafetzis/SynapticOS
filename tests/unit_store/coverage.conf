# Coverage build overlay: gcov-instrument src/core only (see the
# root CMakeLists) and shed enough flash/RAM for the counters to fit
# the 64 KB QEMU target. Used by tools/syn_coverage.sh via
# -DEXTRA_CONF_FILE=coverage.conf.
CONFIG_SYNAPTIC_COVERAGE=y
CONFIG_COVERAGE_GCOV_HEAP_SIZE=0
# TEST_LOGGING_DEFAULTS selects LOG; disable it first
CONFIG_TEST_LOGGING_DEFAULTS=n
CONFIG_LOG=n
CONFIG_HEAP_MEM_POOL_SIZE=3072
# This app's suites exercise the store/OTA/flash stack; instrumenting
# all of src/core does not fit next to the 18 KB RAM flash fixture.
CONFIG_SYNAPTIC_COVERAGE_FILES="syn_model_store.c syn_model_ota.c syn_flash_port_ram.c syn_flash_port_mcx.c"
# Not exercised by the store suites; frees RAM for the counters
CONFIG_SYNAPTIC_LAYER_EXEC=n
CONFIG_SYNAPTIC_HEALTH=n
