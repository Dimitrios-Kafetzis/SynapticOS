manifest:
  # The optional `neutron` group pulls NXP's eIQ middleware (Neutron
  # NPU driver + firmware libraries). Those libraries are covered by
  # NXP's LA_OPT license, NOT Apache-2.0, so they are never vendored
  # into this repository; fetching them from NXP's public repository
  # is an explicit user opt-in:
  #   west config manifest.group-filter -- +neutron
  #   west update mcuxsdk-middleware-eiq
  group-filter: [-neutron]

  remotes:
    - name: zephyrproject-rtos
      url-base: https://github.com/zephyrproject-rtos
    - name: nxp-mcuxpresso
      url-base: https://github.com/nxp-mcuxpresso

  projects:
    - name: zephyr
      remote: zephyrproject-rtos
      revision: v3.7.0
      import:
        name-allowlist:
          - hal_nxp
          - cmsis
          - mcuboot
          - mbedtls
          - segger
    - name: mcuxsdk-middleware-eiq
      remote: nxp-mcuxpresso
      # Pinned to Neutron Software 3.0.0 (driver 3.0.0+0X6d41ac8b),
      # the generation matching neutron-converter SDK_26_03 microcode.
      # Later main states carry driver 3.1.1, which no released
      # converter targets; release tags up to MCUX_2.16.100 predate
      # the neutron folder entirely.
      revision: 02be0f262ebe81d5c31fd2f3d5a6c22e3a837760
      path: modules/eiq
      groups:
        - neutron

  self:
    path: synaptic-os
