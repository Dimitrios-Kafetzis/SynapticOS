# Real eIQ Neutron NPU variant of dual_model (FRDM-MCXN947 only):
#
#   west build -b frdm_mcxn947/mcxn947/cpu0 synaptic-os/samples/dual_model \
#       -- -DEXTRA_CONF_FILE=neutron.conf
#
# The Neutron HAL statics (49,152 B converter-sized scratch + context
# pool + real input buffer) do not fit next to the default 128 KB
# arena on the 256 KB CPU0 RAM split. The arena is trimmed to 80 KB:
# the highest arena peak ever measured on this app is 27,856 B
# (Phase 5 soak, 11k inferences), so 64 KB of usable tensor space
# keeps a 2.3x margin while freeing the RAM the NPU driver needs.
CONFIG_SYNAPTIC_NEUTRON=y
CONFIG_SYNAPTIC_NEUTRON_SCRATCH_SIZE=49152
CONFIG_SYNAPTIC_TENSOR_ARENA_SIZE=81920
